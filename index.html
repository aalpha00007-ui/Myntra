<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist Nudge</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#fafafa;color:#1a1a1a}h1{font-size:22px}label{display:block;margin-top:12px;font-weight:600}input,select,textarea,button{width:100%;padding:10px;font-size:16px;margin-top:4px;box-sizing:border-box;border:1px solid #888;border-radius:6px}button{background:#0b5cad;color:#fff;border:0;margin-top:16px;font-weight:600}.card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:12px;margin-top:16px}.tag{display:inline-block;background:#e6f0fa;color:#0b3d73;border-radius:4px;padding:1px 6px;font-size:13px;margin-right:6px}small{color:#555}</style></head><body>
<h1>Wishlist Nudge</h1><small>Prototype for a Myntra-style wishlist. Not affiliated with Myntra. No discounts, just clarity.</small>
<label>Item (name and brand)<input id="item" placeholder="e.g. Roadster oversized denim jacket"></label>
<label>Days since you saved it<input id="days" type="number" value="10" min="0"></label>
<label>Why did you save it?<select id="reason"><option value="style">Love the style</option><option value="occasion">For an occasion</option><option value="price">Waiting for a better price</option><option value="reviews">Unsure about reviews/quality</option></select></label>
<label>Do you know your size in this brand?<select id="known"><option value="yes">Yes</option><option value="no">No</option></select></label>
<label>Anything else holding you back? (optional)<textarea id="notes" rows="2"></textarea></label>
<button onclick="go()">Help me decide</button><div id="out"></div>
<script>async function go(){const b={item:item.value,days:days.value,reason:reason.value,knownSize:known.value,notes:notes.value};
const r=await fetch('/api/advise',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();
out.innerHTML='<div class="card"><b>'+j.verdict+'</b> <small>(confidence '+j.score+'/100'+(j.mode==='ai'?', AI':'')+')</small>'+j.items.map(i=>'<p><span class="tag">'+i.tag+'</span>'+i.text+'</p>').join('')+'</div>';}</script></body></html>
